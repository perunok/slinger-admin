services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slinger}
      POSTGRES_USER: ${POSTGRES_USER:-slinger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slinger}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  api:
    image: ${SLINGER_API_IMAGE:-slinger-api:latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-slinger}:${POSTGRES_PASSWORD:-slinger}@postgres:5432/${POSTGRES_DB:-slinger}?sslmode=disable
      SLINGER_API_ADDR: :8080
      SLINGER_ADMIN_BOOTSTRAP: ${SLINGER_ADMIN_BOOTSTRAP:-[{"username":"admin","password":"admin","email":"admin@slinger.local","display_name":"Bootstrap Admin","platform_role":"super_admin"}]}
      SLINGER_BASE_URL: ${SLINGER_BASE_URL:-http://localhost}
      SLINGER_ADMIN_DASHBOARD_URL: ${SLINGER_ADMIN_DASHBOARD_URL:-http://localhost}
      SLINGER_SIGNING_SECRET: ${SLINGER_SIGNING_SECRET:-change-me-in-production}
    depends_on:
      - postgres
      - redis
    expose:
      - "8080"

  worker:
    image: ${SLINGER_API_IMAGE:-slinger-api:latest}
    command: ["/app/worker"]
    depends_on:
      - postgres
      - redis

  realtime:
    image: ${SLINGER_API_IMAGE:-slinger-api:latest}
    command: ["/app/realtime"]
    depends_on:
      - redis

  admin-dashboard:
    image: ${SLINGER_ADMIN_DASHBOARD_IMAGE:-slinger-admin-dashboard:latest}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - api
    expose:
      - "4173"

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
      - admin-dashboard
    ports:
      - "${SLINGER_HTTP_PORT:-80}:80"
      - "${SLINGER_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres-data:
