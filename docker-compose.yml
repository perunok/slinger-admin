services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slinger
      POSTGRES_USER: slinger
      POSTGRES_PASSWORD: slinger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://slinger:slinger@postgres:5432/slinger?sslmode=disable
      SLINGER_API_ADDR: :8080
      SLINGER_ADMIN_EMAIL: henokm@act.com.et
      SLINGER_ADMIN_NAME: Bootstrap Admin
      SLINGER_BASE_URL: http://localhost:8080
      SLINGER_ADMIN_DASHBOARD_URL: http://localhost:5173
      SLINGER_SIGNING_SECRET: change-me-in-production
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["/app/worker"]
    depends_on:
      - postgres
      - redis

  realtime:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["/app/realtime"]
    depends_on:
      - redis
    ports:
      - "8081:8081"

  admin-dashboard:
    build:
      context: .
      dockerfile: admin-dashboard/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
      - admin-dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres-data:
