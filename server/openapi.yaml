components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: slinger_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with cookieAuth on POST/PUT/PATCH/DELETE.
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - rate_limited
                - workspace_access_denied
                - version_mismatch
                - invite_invalid
                - join_request_not_allowed
                - sync_conflict
                - csrf_invalid
                - origin_not_allowed
                - internal_error
            message:
              type: string
            details:
              type: object
              additionalProperties: {}
            request_id:
              type: string
          required:
            - code
            - message
            - details
            - request_id
          additionalProperties: false
      required:
        - error
      additionalProperties: false
