openapi: 3.0.3
info:
  title: Slinger Cloud API
  version: 2.0.0
  description: |-
    Generated from the zod schemas of the routes registered in `server/src`; do not edit by hand (`npm run openapi`).

    Auth: `Authorization: Bearer <access token>` (desktop) or the `slinger_session` httpOnly cookie (dashboard). Cookie-authenticated unsafe requests must send `X-CSRF-Token` (from `POST /v1/auth/browser/login` or `GET /v1/auth/browser/session`).

    Every response carries `X-Request-Id`, echoed in `error.request_id`. List endpoints use cursor pagination (`?cursor=&limit=&order=`) and return `{ items, page: { next_cursor, has_more } }`.

    Behind the bundled Caddy proxy the same routes are reachable at `/v1/...` and, for the dashboard, `/api/v1/...`.
servers:
  - url: http://localhost:8080
    description: Direct to the server container
tags:
  - name: System
  - name: Auth
  - name: Workspaces
  - name: Membership
  - name: Hosts
  - name: Content
  - name: Sync
  - name: Realtime
  - name: Admin
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness/readiness probe; verifies the database is reachable (503 otherwise)
      tags:
        - System
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  timestamp:
                    type: string
                required:
                  - status
                  - timestamp
                additionalProperties: false
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  timestamp:
                    type: string
                required:
                  - status
                  - timestamp
                additionalProperties: false
  /device:
    get:
      operationId: getDevice
      summary: Device login approval page (HTML). Open from `verification_uri_complete`.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
      parameters:
        - name: user_code
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
    post:
      operationId: postDevice
      summary: Submit code + email + password (urlencoded form) to approve a device login
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Rate limited per IP+email pair like the login endpoints.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user_code:
                  type: string
                  minLength: 4
                  maxLength: 16
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - user_code
                - email
                - password
              additionalProperties: false
  /v1/auth/browser/login:
    post:
      operationId: postV1AuthBrowserLogin
      summary: Dashboard login (email + password). Sets the httpOnly session cookie and returns the CSRF token.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        type: string
                      platform_role:
                        type: string
                        enum:
                          - super_admin
                          - platform_admin
                          - user
                    required:
                      - id
                      - email
                      - display_name
                      - platform_role
                    additionalProperties: false
                  csrf_token:
                    type: string
                required:
                  - user
                  - csrf_token
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: "Rate limited per IP+email pair (default 10 attempts / 5 minutes, 429 rate_limited). Cookie: `slinger_session`, httpOnly, SameSite=Lax, Secure when SLINGER_COOKIE_SECURE is true (default in production)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - email
                - password
              additionalProperties: false
  /v1/auth/device/start:
    post:
      operationId: postV1AuthDeviceStart
      summary: Start the desktop device login flow
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                  verification_uri:
                    type: string
                  verification_uri_complete:
                    type: string
                  expires_in:
                    type: integer
                  interval:
                    type: integer
                required:
                  - device_code
                  - user_code
                  - verification_uri
                  - verification_uri_complete
                  - expires_in
                  - interval
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                device_name:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - client_name
                - device_name
              additionalProperties: false
  /v1/auth/device/poll:
    post:
      operationId: postV1AuthDevicePoll
      summary: Poll a device login; returns tokens once approved (exactly once)
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
                    required:
                      - status
                    additionalProperties: false
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - expired
                    required:
                      - status
                    additionalProperties: false
                  - type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      expires_in:
                        type: integer
                      token_type:
                        type: string
                        enum:
                          - Bearer
                      status:
                        type: string
                        enum:
                          - approved
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                          display_name:
                            type: string
                          platform_role:
                            type: string
                            enum:
                              - super_admin
                              - platform_admin
                              - user
                        required:
                          - id
                          - email
                          - display_name
                          - platform_role
                        additionalProperties: false
                    required:
                      - access_token
                      - refresh_token
                      - expires_in
                      - token_type
                      - status
                      - user
                    additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_code:
                  type: string
                  minLength: 8
                  maxLength: 200
              required:
                - device_code
              additionalProperties: false
  /v1/auth/refresh:
    post:
      operationId: postV1AuthRefresh
      summary: Rotate a refresh token for a new access/refresh pair
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
                  token_type:
                    type: string
                    enum:
                      - Bearer
                required:
                  - access_token
                  - refresh_token
                  - expires_in
                  - token_type
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Refresh tokens are single-use. Presenting an already-used token revokes every refresh token of that user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 8
                  maxLength: 500
              required:
                - refresh_token
              additionalProperties: false
  /v1/auth/device/approve:
    post:
      operationId: postV1AuthDeviceApprove
      summary: Approve a pending device login (used by the dashboard for the signed-in user)
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Binds the pending device flow with this `user_code` to the caller. Cookie callers must send X-CSRF-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_code:
                  type: string
                  minLength: 4
                  maxLength: 16
              required:
                - user_code
              additionalProperties: false
  /v1/auth/logout:
    post:
      operationId: postV1AuthLogout
      summary: Revoke a refresh token (desktop logout). Always succeeds.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 8
                  maxLength: 500
              required:
                - refresh_token
              additionalProperties: false
  /v1/auth/browser/logout:
    post:
      operationId: postV1AuthBrowserLogout
      summary: "Dashboard logout: deletes the server-side session and clears the cookie"
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/browser/session:
    get:
      operationId: getV1AuthBrowserSession
      summary: "Current dashboard session: user + CSRF token (recoverable after a page reload)"
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        type: string
                      platform_role:
                        type: string
                        enum:
                          - super_admin
                          - platform_admin
                          - user
                    required:
                      - id
                      - email
                      - display_name
                      - platform_role
                    additionalProperties: false
                  csrf_token:
                    type: string
                required:
                  - user
                  - csrf_token
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: The CSRF token is HMAC-derived from the session id, so it can be re-issued without rotating. Only readable by allowlisted/same origins (CORS).
  /v1/me:
    get:
      operationId: getV1Me
      summary: Current user and their active workspace memberships
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        type: string
                      platform_role:
                        type: string
                        enum:
                          - super_admin
                          - platform_admin
                          - user
                    required:
                      - id
                      - email
                      - display_name
                      - platform_role
                    additionalProperties: false
                  workspace_memberships:
                    type: array
                    items:
                      type: object
                      properties:
                        workspace_id:
                          type: string
                        role:
                          type: string
                          enum:
                            - owner
                            - admin
                            - editor
                            - viewer
                      required:
                        - workspace_id
                        - role
                      additionalProperties: false
                required:
                  - user
                  - workspace_memberships
                additionalProperties: false
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/password:
    post:
      operationId: postV1MePassword
      summary: Change own password; revokes all refresh tokens and dashboard sessions
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 256
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 256
              required:
                - current_password
                - new_password
              additionalProperties: false
  /v1/workspaces:
    get:
      operationId: getV1Workspaces
      summary: Workspaces the caller is an active member of (with the caller's role)
      tags:
        - Workspaces
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        slug:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        owner_user_id:
                          type: string
                        visibility:
                          type: string
                        default_role_for_requests:
                          type: string
                          enum:
                            - owner
                            - admin
                            - editor
                            - viewer
                        host_mode:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        version:
                          type: integer
                        role:
                          type: string
                          enum:
                            - owner
                            - admin
                            - editor
                            - viewer
                      required:
                        - id
                        - slug
                        - name
                        - description
                        - owner_user_id
                        - visibility
                        - default_role_for_requests
                        - host_mode
                        - created_at
                        - updated_at
                        - version
                        - role
                      additionalProperties: false
                  page:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                      has_more:
                        type: boolean
                    required:
                      - next_cursor
                      - has_more
                    additionalProperties: false
                required:
                  - items
                  - page
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Platform admins see every workspace via GET /v1/admin/workspaces instead.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
    post:
      operationId: postV1Workspaces
      summary: Create a workspace; the caller becomes its owner
      tags:
        - Workspaces
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      owner_user_id:
                        type: string
                      visibility:
                        type: string
                      default_role_for_requests:
                        type: string
                        enum:
                          - owner
                          - admin
                          - editor
                          - viewer
                      host_mode:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      version:
                        type: integer
                    required:
                      - id
                      - slug
                      - name
                      - description
                      - owner_user_id
                      - visibility
                      - default_role_for_requests
                      - host_mode
                      - created_at
                      - updated_at
                      - version
                    additionalProperties: false
                required:
                  - workspace
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict / version_mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                slug:
                  type: string
                  minLength: 3
                  maxLength: 63
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                description:
                  type: string
                  maxLength: 2000
                  default: ""
              required:
                - name
              additionalProperties: false
  /v1/workspaces/resolve:
    get:
      operationId: getV1WorkspacesResolve
      summary: Resolve a workspace by id, slug or active host binding (minimal fields; for join-request discovery)
      tags:
        - Workspaces
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      name:
                        type: string
                      host_mode:
                        type: string
                    required:
                      - id
                      - slug
                      - name
                      - host_mode
                    additionalProperties: false
                  membership:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - owner
                          - admin
                          - editor
                          - viewer
                    required:
                      - role
                    additionalProperties: false
                    nullable: true
                required:
                  - workspace
                  - membership
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Provide exactly one of `id`, `slug`, `host`. Returns only id/slug/name/host_mode plus the caller's role, if any.
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: slug
          in: query
          required: false
          schema:
            type: string
            maxLength: 63
        - name: host
          in: query
          required: false
          schema:
            type: string
            maxLength: 253
  /v1/workspaces/publish:
    post:
      operationId: postV1WorkspacesPublish
      summary: Publish a local desktop workspace (create) or bind to an existing one (attach_existing)
      tags:
        - Workspaces
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      owner_user_id:
